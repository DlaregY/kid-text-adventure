name: Touch feedback workspace
on:
  push:
    branches: [codex/ike-touch-workspace-2026-10-09]
    paths: [.github/workflows/touch-workspace.yml]
permissions:
  contents: write
jobs:
  publish-reviewed-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply the tested three-file followup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib
          text = pathlib.Path('.transport/hold.patch').read_text().replace('\n diff --git ', '\ndiff --git ')
          data = text.encode('utf-8')
          assert hashlib.sha256(data).hexdigest() == 'c1b217cb803b042556242cecfc6702415831e8cec66ad6028ab36393da483b4b', 'Patch differs from tested source'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'hold.patch').write_bytes(data)
          PY
          base=486a1c574d93a721de25305f558992b66e2cbeb0
          branch=codex/ike-touch-branding-2026-10-09
          test "$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" = "$base"
          git worktree add --detach "$RUNNER_TEMP/hold-review" "$base"
          cd "$RUNNER_TEMP/hold-review"
          git apply --index "$RUNNER_TEMP/hold.patch"
          printf '%s\n' \
            '37826b615c348cb49f689be5b95fd58100a6cf9c293f8c95bd1a0b896926f610  scripts/Game.gd' \
            'b385e7db9ca4f1a1dc77e9dd8eef08bcc059a694a97698971a1164d3ca95b9c6  tests/touch_input.gd' \
            'd267c359d48b10381c061209a287cd7863aebae76431d10db1e1b199a78e3c96  docs/touch-feedback.md' | sha256sum --check --strict
          test "$(git diff --cached --name-only | wc -l)" = 3
          git diff --cached --check
          git -c user.name=Gerald -c user.email=39918383+DlaregY@users.noreply.github.com commit -m 'Pause queued commands throughout replacement holds and drags'
          git push origin HEAD:"refs/heads/$branch"
          echo 'Fast-forwarded review branch only; no main update, Android export, keys or Play access.'
