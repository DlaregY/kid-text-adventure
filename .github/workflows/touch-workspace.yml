name: Touch feedback workspace
on:
  push:
    branches: [codex/ike-touch-workspace-2026-10-09]
    paths: [.github/workflows/touch-workspace.yml]
permissions:
  contents: write
jobs:
  publish-reviewed-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare pinned image encoder
        run: python3 -m pip install --target "$RUNNER_TEMP/pillow" 'Pillow==12.3.0'
      - name: Verify exact reviewed patch and reconstructed tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, zlib
          encoded = ''.join(pathlib.Path(f'.transport/touch-{i}.b64').read_text().strip() for i in range(4))
          data = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '745aaca962d91d50f32ef3313d9b59cc087b635e0896311c4e698d80360809e5', 'Patch checksum mismatch'
          packet = json.loads(data)
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          (root / 'touch.patch').write_text(packet['patch'], encoding='utf-8')
          (root / 'touch.commit').write_text(packet['commit'], encoding='utf-8')
          PY
          base=ad758b0e569df8d65ddfa1f2e8befbb2db4368d5
          branch=codex/ike-touch-branding-2026-10-09
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git worktree add --detach "$RUNNER_TEMP/touch-review" "$base"
          cd "$RUNNER_TEMP/touch-review"
          git apply --index "$RUNNER_TEMP/touch.patch"
          cp icon.png assets/branding/ike-portrait.png
          PYTHONPATH="$RUNNER_TEMP/pillow" python3 - <<'PY'
          from PIL import Image
          import hashlib
          from pathlib import Path
          source = Image.open('icon.png').convert('RGBA')
          assert source.size == (256, 256)
          foreground = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          foreground.alpha_composite(source, (88, 88))
          path = Path('assets/icons/android/ike_adaptive_foreground_432.png')
          foreground.save(path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'cb6219980b3aec5b60b48a7891d7f11e8f459ea445eb42aa7696ae1291a5e842', 'Adaptive image differs from reviewed pixels/file'
          PY
          git add assets/branding/ike-portrait.png assets/icons/android/ike_adaptive_foreground_432.png
          test "$(git write-tree)" = d3e54493150031ba78d3b0a91dce23e5fc6d3b61
          commit=$(git hash-object -t commit -w --stdin < "$RUNNER_TEMP/touch.commit")
          test "$commit" = b8c4fb2702eeb298f13374d53feb54e7958177c5
          test "$(git rev-parse "$commit^")" = "$base"
          git diff --check "$base" "$commit"
          git push origin "$commit:refs/heads/$branch"
          echo 'Published reviewed branch only; no main update, Android export, Play access or release.'
